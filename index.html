<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f5f2eb" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self'; connect-src 'self'; img-src 'self' data:; frame-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'"
    />
    <title>鹈鹕动物园</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="site-header">
      <a class="wordmark" href="./" aria-label="鹈鹕动物园首页">鹈鹕动物园</a>
      <a class="upload-button" href="https://github.com/richard950825-sys/pelican-zoo/issues/new?template=upload.yml" target="_blank" rel="noopener" aria-label="上传 HTML 作品（新标签页打开）" title="上传 HTML 作品：提交后回到本页，会自动提示发布结果">+</a>
    </header>

    <main>
      <h1 class="sr-only">鹈鹕动物园作品墙</h1>
      <section class="gallery" id="gallery" aria-live="polite" aria-label="动态作品墙"></section>
      <p class="empty-state" id="empty-state" hidden>第一只鹈鹕还没入园。</p>
    </main>

    <template id="work-template">
      <article class="work">
        <iframe class="work-frame" sandbox="allow-scripts" referrerpolicy="no-referrer"></iframe>
        <div class="work-meta">
          <strong class="work-title"></strong>
          <span class="work-model"></span>
        </div>
      </article>
    </template>

    <script src="app.js"></script>
  </body>
</html>
