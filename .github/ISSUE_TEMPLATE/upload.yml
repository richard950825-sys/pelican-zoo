name: 上传作品
description: 提交一个会动的 HTML 作品
title: "作品："
labels: ["upload"]
body:
  - type: markdown
    attributes:
      value: "将一个不超过 5 MB 的 `.html` 文件拖入下面的文件框。提交后发布约需 1 分钟：机器人会在本 issue 下评论并附上作品链接；如果上传前还开着鹈鹕动物园的页面，回到那个页面会自动提示发布结果并高亮你的作品。"
  - type: textarea
    id: html-file
    attributes:
      label: HTML 文件
      description: 拖入或选择一个 `.html` 文件。
    validations:
      required: true
  - type: input
    id: title
    attributes:
      label: 标题
      description: 留空时使用文件名。
      placeholder: 我的鹈鹕
    validations:
      required: false
  - type: dropdown
    id: model
    attributes:
      label: 生成模型
      options:
        - GPT / Codex
        - Claude
        - Gemini
        - DeepSeek
        - 通义千问
        - Kimi
        - GLM
        - 豆包
        - 其他
    validations:
      required: true
  - type: input
    id: model-detail
    attributes:
      label: 其他模型名称
      description: 仅在选择“其他”时填写。
    validations:
      required: false
