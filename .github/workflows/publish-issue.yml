name: Publish submitted work

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write
  pages: write
  id-token: write

concurrency:
  group: gallery-publish
  cancel-in-progress: false

jobs:
  publish:
    if: contains(github.event.issue.labels.*.name, 'upload')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: node scripts/publish-issue.mjs
      - run: |
          git config user.name "pelican-zoo[bot]"
          git config user.email "pelican-zoo[bot]@users.noreply.github.com"
          git add works works.json
          git commit -m "Publish work from issue #${{ github.event.issue.number }}"
          git push
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
      - run: gh issue close "${{ github.event.issue.number }}" --comment "作品已发布到鹈鹕动物园。"
        env:
          GH_TOKEN: ${{ github.token }}
      - if: failure()
        run: gh issue comment "${{ github.event.issue.number }}" --body "发布失败：请确认附加的是不超过 5 MB 的 .html 文件。"
        env:
          GH_TOKEN: ${{ github.token }}
