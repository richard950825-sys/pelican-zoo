<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>鹈鹕骑行记 · SVG 2D 动画</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center;
    background: #0f172a; font-family: "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    padding: 20px; gap: 12px;
  }
  h1 { color: #f8fafc; font-size: 22px; letter-spacing: 2px; }
  h1 small { color: #94a3b8; font-weight: 400; font-size: 13px; margin-left: 8px; letter-spacing: 0; }
  .stage {
    width: min(900px, 96vw); border-radius: 16px; overflow: hidden;
    box-shadow: 0 20px 60px rgba(0,0,0,.5); border: 1px solid #334155;
  }
  svg { display: block; width: 100%; height: auto; }
  .bar { display: flex; gap: 10px; align-items: center; color: #cbd5e1; font-size: 14px; }
  .bar button {
    background: #1e293b; color: #f1f5f9; border: 1px solid #475569; border-radius: 8px;
    padding: 6px 14px; cursor: pointer; font-size: 14px;
  }
  .bar button:hover { background: #334155; }
  .bar input { accent-color: #fb923c; }

  /* ---------- SVG 动画 ---------- */
  .spin { transform-box: fill-box; transform-origin: center; animation: spin .55s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .bob-soft { animation: bobSoft .7s ease-in-out infinite alternate; }
  @keyframes bobSoft { from { transform: translateY(-2px); } to { transform: translateY(3px); } }

  .cloud1 { animation: drift 26s linear infinite; }
  .cloud2 { animation: drift 38s linear infinite; }
  .cloud3 { animation: drift 18s linear infinite; }
  @keyframes drift { from { transform: translateX(120px); } to { transform: translateX(-980px); } }

  .scroll-fast { animation: scrollX 1.6s linear infinite; }
  .scroll-mid  { animation: scrollX 4.5s linear infinite; }
  @keyframes scrollX { from { transform: translateX(0); } to { transform: translateX(-400px); } }

  .dash-move { animation: dashMove .5s linear infinite; }
  @keyframes dashMove { to { stroke-dashoffset: -40; } }

  .wing-steer { transform-box: fill-box; transform-origin: 20% 80%; animation: steer 1.4s ease-in-out infinite; }
  @keyframes steer { 0%,100% { transform: rotate(3deg); } 50% { transform: rotate(-4deg); } }

  .pouch { transform-box: fill-box; transform-origin: left top; animation: pouchW 1.4s ease-in-out infinite; }
  @keyframes pouchW { 0%,100% { transform: rotate(2.5deg) scaleY(1); } 50% { transform: rotate(-2deg) scaleY(1.06); } }

  .tail-wag { transform-box: fill-box; transform-origin: right center; animation: wag .7s ease-in-out infinite; }
  @keyframes wag { 0%,100% { transform: rotate(6deg); } 50% { transform: rotate(-6deg); } }

  .scarf-flow { transform-box: fill-box; transform-origin: right center; animation: scarfF .5s ease-in-out infinite alternate; }
  @keyframes scarfF { from { transform: rotate(-6deg) skewY(-4deg); } to { transform: rotate(7deg) skewY(5deg); } }

  .eye-blink { transform-box: fill-box; transform-origin: center; animation: blink 4.2s ease-in-out infinite; }
  @keyframes blink { 0%,92%,100% { transform: scaleY(1); } 95% { transform: scaleY(.08); } }

  .sun-rays { transform-box: fill-box; transform-origin: center; animation: spin 24s linear infinite; }

  .dust { opacity: 0; transform-box: fill-box; transform-origin: center; animation: dust 1.1s ease-out infinite; }
  .dust.d2 { animation-delay: .35s; } .dust.d3 { animation-delay: .7s; }
  @keyframes dust {
    0% { opacity: .7; transform: translate(0,0) scale(.4); }
    100% { opacity: 0; transform: translate(-70px,-30px) scale(1.4); }
  }
  .speed-line { animation: speedLine .4s linear infinite; }
  .speed-line.s2 { animation-delay: .13s; } .speed-line.s3 { animation-delay: .26s; }
  @keyframes speedLine { 0% { opacity: 0; transform: translateX(30px); } 30% { opacity: .8; } 100% { opacity: 0; transform: translateX(-60px); } }

  .paused * { animation-play-state: paused !important; }
</style>
</head>
<body>

<div class="bar">
  <button id="btn">⏸ 暂停</button>
  <label>速度 <input id="speed" type="range" min="0.2" max="2.5" step="0.1" value="1"></label>
  <span id="tip">鹈鹕正蹬着它的小车去送鱼 🐟</span>
</div>

<script>
const svg = document.getElementById('scene');
const BB = { x: 395, y: 335 }, R = 24;             // 五通 & 曲柄半径
const hips = { far: { x: 368, y: 232 }, near: { x: 392, y: 234 } };
const $ = id => document.getElementById(id);
const legFar = $('legFar'), legNear = $('legNear');
const footFar = $('footFar'), footNear = $('footNear');
const crankFar = $('crankFar'), crankNear = $('crankNear');
const pedalFar = $('pedalFar'), pedalNear = $('pedalNear');
const rider = $('rider');

let angle = 0, speed = 1, running = true;

function knee(hip, foot, fwd) {
  return {
    x: (hip.x + foot.x) / 2 + fwd,
    y: (hip.y + foot.y) / 2 - 4
  };
}
function setLeg(poly, footEl, hip, foot, fwd) {
  const k = knee(hip, foot, fwd);
  poly.setAttribute('points', `${hip.x},${hip.y} ${k.x.toFixed(1)},${k.y.toFixed(1)} ${foot.x.toFixed(1)},${foot.y.toFixed(1)}`);
  footEl.setAttribute('cx', foot.x); footEl.setAttribute('cy', foot.y - 4);
}
function frame(dt) {
  if (running) {
    angle += dt * 4.4 * speed;                    // 蹬踏角速度
    const a1 = angle, a2 = angle + Math.PI;       // 双脚反相
    const p1 = { x: BB.x + R * Math.cos(a1), y: BB.y + R * Math.sin(a1) };
    const p2 = { x: BB.x + R * Math.cos(a2), y: BB.y + R * Math.sin(a2) };
    crankNear.setAttribute('x2', p1.x); crankNear.setAttribute('y2', p1.y);
    crankFar.setAttribute('x2', p2.x);  crankFar.setAttribute('y2', p2.y);
    pedalNear.setAttribute('transform', `translate(${p1.x},${p1.y})`);
    pedalFar.setAttribute('transform', `translate(${p2.x},${p2.y})`);
    setLeg(legNear, footNear, hips.near, p1, 24);
    setLeg(legFar, footFar, hips.far, p2, 20);
    rider.setAttribute('transform', `translate(0,${(Math.sin(angle * 2) * 3.5).toFixed(2)})`); // 身体起伏
  }
  requestAnimationFrame(frame);
}
let last = performance.now();
(function loop(t) {
  frame((t - last) / 1000); last = t;
  requestAnimationFrame(loop);
})(last);

$('btn').onclick = e => {
  running = !running;
  svg.classList.toggle('paused', !running);
  e.target.textContent = running ? '⏸ 暂停' : '▶ 播放';
};
$('speed').oninput = e => {
  speed = +e.target.value;
  svg.style.setProperty('--x', speed);
  document.querySelectorAll('#scene .spin').forEach(el => el.style.animationDuration = (0.55 / speed) + 's');
  document.querySelectorAll('#scene .dash-move').forEach(el => el.style.animationDuration = (0.5 / speed) + 's');
  document.querySelectorAll('#scene .scroll-fast').forEach(el => el.style.animationDuration = (1.6 / speed) + 's');
};
</script>
<script data-pelican-scroll>window.addEventListener("load",function(){requestAnimationFrame(function(){var d=document.documentElement,b=document.body,w=Math.max(d.scrollWidth,b?b.scrollWidth:0),h=Math.max(d.scrollHeight,b?b.scrollHeight:0);window.scrollTo(Math.max(0,(w-window.innerWidth)/2),Math.max(0,(h-window.innerHeight)/2))})});</script></body>
