<script>
const scene=document.getElementById('scene'),toggle=document.getElementById('toggle'),speedInput=document.getElementById('speed');
const reduced=matchMedia('(prefers-reduced-motion: reduce)');
let paused=reduced.matches,speed=1,phase=0,last=0;
const nodes=Object.fromEntries(['farLeg','farFoot','nearLeg','nearLegFill','nearFoot','nearPedal','crank'].map(id=>[id,document.getElementById(id)]));
function state(){scene.classList.toggle('paused',paused);toggle.setAttribute('aria-pressed',String(paused));document.getElementById('icon').textContent=paused?'▷':'Ⅱ';document.getElementById('label').textContent=paused?'出发，继续兜风':'停下来，吹吹风';}
toggle.addEventListener('click',()=>{paused=!paused;if(!paused)scene.classList.remove('animated');state();});
speedInput.addEventListener('input',()=>{speed=Number(speedInput.value);scene.style.setProperty('--cycle',1.4/speed+'s');scene.style.setProperty('--road',2.8/speed+'s');scene.style.setProperty('--plants',8/speed+'s');});
function leg(angle,near){const x=492+25*Math.cos(angle),y=393+25*Math.sin(angle);const hx=near?455:449,hy=near?278:277;const dx=x-hx,dy=y-hy,d=Math.hypot(dx,dy),a=69,b=64;const along=(a*a-b*b+d*d)/(2*d),height=Math.sqrt(Math.max(0,a*a-along*along));const kx=hx+dx/d*along+dy/d*height,ky=hy+dy/d*along-dx/d*height;const path=`M${hx} ${hy}L${kx} ${ky}L${x} ${y}`;if(near){nodes.nearLeg.setAttribute('d',path);nodes.nearLegFill.setAttribute('d',path);nodes.nearFoot.setAttribute('d',`M${x-7} ${y}q11-5 24 0`);nodes.nearPedal.setAttribute('d',`M${x-12} ${y+6}h30`);}else{nodes.farLeg.setAttribute('d',path);nodes.farFoot.setAttribute('d',`M${x-7} ${y}h25`);}return{x,y};}
function draw(){const a=leg(phase,true),b=leg(phase+Math.PI,false);nodes.crank.setAttribute('d',`M${b.x} ${b.y}L${a.x} ${a.y}`);}
function frame(now){if(last&&!paused&&!document.hidden){phase+=Math.min((now-last)/1000,.05)*speed*2*Math.PI/1.4;draw();}last=now;requestAnimationFrame(frame);}
state();draw();requestAnimationFrame(frame);
</script>
