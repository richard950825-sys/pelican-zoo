<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pelican Coast Cruiser - 鹈鹕骑自行车 2D SVG 动画</title>
<style>
  :root {
    --bg-ground: #0d1527;
    --card-bg: rgba(26, 38, 65, 0.82);
    --card-border: rgba(255, 255, 255, 0.12);
    --card-shadow: 0 16px 36px -10px rgba(0, 0, 0, 0.45);
    --text-primary: #f8fafc;
    --text-secondary: #94a3b8;
    --accent: #ff7e67;
    --accent-hover: #ff9480;
    --accent-teal: #14b8a6;
    --accent-gold: #f59e0b;
    --btn-bg: rgba(255, 255, 255, 0.08);
    --btn-border: rgba(255, 255, 255, 0.16);
    --btn-active: #ff7e67;
    --font-heading: 'Outfit', system-ui, -apple-system, sans-serif;
    --font-ui: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
  }

  @media (prefers-color-scheme: light) {
    :root:not([data-theme="dark"]) {
      --bg-ground: #f1f5f9;
      --card-bg: rgba(255, 255, 255, 0.9);
      --card-border: rgba(15, 23, 42, 0.08);
      --card-shadow: 0 16px 36px -10px rgba(15, 23, 42, 0.12);
      --text-primary: #0f172a;
      --text-secondary: #64748b;
      --btn-bg: rgba(15, 23, 42, 0.05);
      --btn-border: rgba(15, 23, 42, 0.12);
    }
  }

  :root[data-theme="light"] {
    --bg-ground: #f1f5f9;
    --card-bg: rgba(255, 255, 255, 0.9);
    --card-border: rgba(15, 23, 42, 0.08);
    --card-shadow: 0 16px 36px -10px rgba(15, 23, 42, 0.12);
    --text-primary: #0f172a;
    --text-secondary: #64748b;
    --btn-bg: rgba(15, 23, 42, 0.05);
    --btn-border: rgba(15, 23, 42, 0.12);
  }

  :root[data-theme="dark"] {
    --bg-ground: #0d1527;
    --card-bg: rgba(26, 38, 65, 0.82);
    --card-border: rgba(255, 255, 255, 0.12);
    --card-shadow: 0 16px 36px -10px rgba(0, 0, 0, 0.45);
    --text-primary: #f8fafc;
    --text-secondary: #94a3b8;
    --btn-bg: rgba(255, 255, 255, 0.08);
    --btn-border: rgba(255, 255, 255, 0.16);
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    -webkit-tap-highlight-color: transparent;
  }

  body {
    background-color: var(--bg-ground);
    color: var(--text-primary);
    font-family: var(--font-ui);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    padding-block: clamp(16px, 3vh, 32px);
    padding-inline: 16px;
    user-select: none;
    transition: background-color 0.4s ease, color 0.4s ease;
  }

  .stage-container {
    width: 100%;
    max-width: 1060px;
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    border-radius: 24px;
    box-shadow: var(--card-shadow);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    overflow: hidden;
    display: flex;
    flex-direction: column;
    transition: all 0.3s ease;
  }

  .stage-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 16px 24px;
    border-bottom: 1px solid var(--card-border);
    flex-wrap: wrap;
    gap: 12px;
  }

  .brand-group {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .brand-icon {
    font-size: 26px;
    line-height: 1;
    filter: drop-shadow(0 2px 4px rgba(0,0,0,0.2));
  }

  .brand-title {
    font-family: var(--font-heading);
    font-size: 20px;
    font-weight: 700;
    letter-spacing: -0.02em;
    color: var(--text-primary);
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .brand-badge {
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    padding: 2px 8px;
    border-radius: 999px;
    background: rgba(20, 184, 166, 0.15);
    color: #14b8a6;
    border: 1px solid rgba(20, 184, 166, 0.3);
  }

  .header-actions {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .svg-canvas-wrapper {
    position: relative;
    width: 100%;
    aspect-ratio: 1000 / 620;
    background: #111;
    overflow: hidden;
    cursor: pointer;
  }

  #pelicanScene {
    width: 100%;
    height: 100%;
    display: block;
  }

  /* Interactive overlay indicators */
  .interactive-hint {
    position: absolute;
    top: 16px;
    right: 16px;
    background: rgba(15, 23, 42, 0.65);
    color: #fff;
    font-size: 12px;
    font-weight: 500;
    padding: 6px 14px;
    border-radius: 20px;
    border: 1px solid rgba(255, 255, 255, 0.2);
    pointer-events: none;
    display: flex;
    align-items: center;
    gap: 6px;
    backdrop-filter: blur(8px);
    transition: opacity 0.5s ease;
  }

  .interactive-hint span.pulse-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #ff7e67;
    animation: pulseGlow 1.8s infinite;
  }

  @keyframes pulseGlow {
    0%, 100% { opacity: 0.4; transform: scale(0.9); }
    50% { opacity: 1; transform: scale(1.2); }
  }

  /* Control Hub */
  .controls-panel {
    padding: 20px 24px;
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 18px;
    background: rgba(0, 0, 0, 0.02);
    border-top: 1px solid var(--card-border);
  }

  .control-card {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .control-label {
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--text-secondary);
  }

  .btn-group {
    display: flex;
    gap: 6px;
    background: var(--btn-bg);
    padding: 4px;
    border-radius: 12px;
    border: 1px solid var(--btn-border);
  }

  .ctrl-btn {
    flex: 1;
    border: none;
    background: transparent;
    color: var(--text-secondary);
    font-family: var(--font-ui);
    font-size: 12px;
    font-weight: 600;
    padding: 8px 10px;
    border-radius: 8px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 5px;
    transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    white-space: nowrap;
  }

  .ctrl-btn:hover {
    color: var(--text-primary);
    background: rgba(255, 255, 255, 0.06);
  }

  .ctrl-btn.active {
    background: var(--btn-active);
    color: #ffffff;
    box-shadow: 0 2px 8px rgba(255, 126, 103, 0.35);
  }

  .action-buttons {
    display: flex;
    gap: 8px;
  }

  .action-btn {
    flex: 1;
    border: 1px solid var(--btn-border);
    background: var(--btn-bg);
    color: var(--text-primary);
    font-family: var(--font-ui);
    font-size: 13px;
    font-weight: 600;
    padding: 9px 14px;
    border-radius: 12px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    transition: all 0.2s ease;
  }

  .action-btn:hover {
    background: rgba(255, 255, 255, 0.12);
    border-color: rgba(255, 255, 255, 0.25);
    transform: translateY(-1px);
  }

  .action-btn:active {
    transform: translateY(1px);
  }

  .action-btn.bell-ringing {
    animation: bellShake 0.4s ease;
    background: #f59e0b;
    color: #fff;
    border-color: #d97706;
  }

  @keyframes bellShake {
    0%, 100% { transform: rotate(0deg); }
    20% { transform: rotate(-14deg); }
    40% { transform: rotate(12deg); }
    60% { transform: rotate(-8deg); }
    80% { transform: rotate(6deg); }
  }

  /* Audio toast indicator */
  .sound-toast {
    position: absolute;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: rgba(15, 23, 42, 0.9);
    color: #fff;
    font-size: 13px;
    font-weight: 600;
    padding: 8px 18px;
    border-radius: 999px;
    border: 1px solid rgba(255, 255, 255, 0.2);
    pointer-events: none;
    opacity: 0;
    transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    display: flex;
    align-items: center;
    gap: 8px;
    box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
    z-index: 20;
  }

  .sound-toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }

  /* Responsive styling */
  @media (max-width: 640px) {
    .controls-panel {
      grid-template-columns: 1fr;
      padding: 16px;
      gap: 14px;
    }
    .stage-header {
      padding: 12px 16px;
    }
    .ctrl-btn {
      font-size: 11px;
      padding: 7px 6px;
    }
  }
</style>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@600;700;800&family=Plus+Jakarta+Sans:wght@500;600;700&display=swap" rel="stylesheet">
</head>
<body>

<div class="stage-container">
  <div class="stage-header">
    <div class="brand-group">
      <span class="brand-icon">🚴</span>
      <h1 class="brand-title">Pelican Coast Cruiser <span class="brand-badge">2D SVG Engine</span></h1>
    </div>
    <div class="header-actions">
      <button class="action-btn" id="toggleSoundBtn" title="切换声音 (Web Audio API)">
        <span id="soundIcon">🔊</span>
        <span id="soundText">音效开</span>
      </button>
      <button class="action-btn" id="themeToggleBtn" title="切换昼夜模式">
        <span id="themeIcon">🌓</span>
      </button>
    </div>
  </div>

  <div class="svg-canvas-wrapper" id="canvasWrapper">
    <svg id="pelicanScene" viewBox="0 0 1000 620" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <!-- Sky Gradients by Time of Day -->
        <linearGradient id="skyDawn" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#312e81" />
          <stop offset="35%" stop-color="#6366f1" />
          <stop offset="65%" stop-color="#f43f5e" />
          <stop offset="85%" stop-color="#fb923c" />
          <stop offset="100%" stop-color="#fef08a" />
        </linearGradient>

        <linearGradient id="skyNoon" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#0284c7" />
          <stop offset="40%" stop-color="#38bdf8" />
          <stop offset="75%" stop-color="#bae6fd" />
          <stop offset="100%" stop-color="#e0f2fe" />
        </linearGradient>

        <linearGradient id="skySunset" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#1e1b4b" />
          <stop offset="30%" stop-color="#4c1d95" />
          <stop offset="60%" stop-color="#be185d" />
          <stop offset="82%" stop-color="#ea580c" />
          <stop offset="100%" stop-color="#facc15" />
        </linearGradient>

        <linearGradient id="skyNight" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#030712" />
          <stop offset="45%" stop-color="#0b1329" />
          <stop offset="75%" stop-color="#111d3d" />
          <stop offset="100%" stop-color="#1e293b" />
        </linearGradient>

        <!-- Sea Horizon Gradients -->
        <linearGradient id="seaGrad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#0369a1" stop-opacity="0.8" />
          <stop offset="40%" stop-color="#0284c7" stop-opacity="0.9" />
          <stop offset="100%" stop-color="#0e7490" />
        </linearGradient>

        <!-- Promenade Pavement Gradient -->
        <linearGradient id="pavementGrad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#334155" />
          <stop offset="35%" stop-color="#475569" />
          <stop offset="80%" stop-color="#1e293b" />
          <stop offset="100%" stop-color="#0f172a" />
        </linearGradient>

        <!-- Bicycle Metallic Teal Gradient -->
        <linearGradient id="bikeFrameGrad" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stop-color="#2dd4bf" />
          <stop offset="45%" stop-color="#0d9488" />
          <stop offset="100%" stop-color="#115e59" />
        </linearGradient>

        <!-- Chrome Tubes Gradient -->
        <linearGradient id="chromeGrad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#ffffff" />
          <stop offset="30%" stop-color="#e2e8f0" />
          <stop offset="50%" stop-color="#94a3b8" />
          <stop offset="70%" stop-color="#cbd5e1" />
          <stop offset="100%" stop-color="#f8fafc" />
        </linearGradient>

        <!-- Rim Gradient -->
        <linearGradient id="rimGrad" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stop-color="#f8fafc" />
          <stop offset="50%" stop-color="#94a3b8" />
          <stop offset="100%" stop-color="#64748b" />
        </linearGradient>

        <!-- Pelican Feathers Gradient -->
        <linearGradient id="pelicanWhite" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#ffffff" />
          <stop offset="60%" stop-color="#f1f5f9" />
          <stop offset="100%" stop-color="#cbd5e1" />
        </linearGradient>

        <!-- Pelican Beak Pouch Gradient (Warm fleshy coral) -->
        <linearGradient id="pouchGrad" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stop-color="#fca5a5" />
          <stop offset="35%" stop-color="#fb7185" />
          <stop offset="70%" stop-color="#f43f5e" />
          <stop offset="100%" stop-color="#e11d48" />
        </linearGradient>

        <!-- Pelican Bill Horn Gradient -->
        <linearGradient id="billGrad" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0%" stop-color="#f59e0b" />
          <stop offset="60%" stop-color="#fbbf24" />
          <stop offset="100%" stop-color="#d97706" />
        </linearGradient>

        <!-- Leather Saddle Gradient -->
        <linearGradient id="saddleGrad" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stop-color="#9a3412" />
          <stop offset="40%" stop-color="#7c2d12" />
          <stop offset="100%" stop-color="#431407" />
        </linearGradient>

        <!-- Headlight Beam Gradient -->
        <linearGradient id="headlightBeam" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0%" stop-color="#fef08a" stop-opacity="0.85" />
          <stop offset="40%" stop-color="#fef9c3" stop-opacity="0.35" />
          <stop offset="100%" stop-color="#fef08a" stop-opacity="0" />
        </linearGradient>

        <!-- Wicker Basket Pattern -->
        <pattern id="wickerPattern" width="8" height="8" patternUnits="userSpaceOnUse">
          <rect width="8" height="8" fill="#b45309" />
          <path d="M0 4h8M4 0v8" stroke="#d97706" stroke-width="1.2" />
          <path d="M0 0l8 8M8 0L0 8" stroke="#78350f" stroke-width="0.7" opacity="0.6" />
        </pattern>

        <!-- Drop Shadow Filter for Pelican and Bike -->
        <filter id="sceneShadow" x="-10%" y="-10%" width="130%" height="130%">
          <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#020617" flood-opacity="0.35" />
        </filter>

        <!-- Wheel Spokes Template Definition -->
        <g id="spokesDef">
          <circle cx="0" cy="0" r="68" fill="none" stroke="url(#rimGrad)" stroke-width="4" />
          <!-- 16 Radial Spokes -->
          <line x1="0" y1="-68" x2="0" y2="68" stroke="#e2e8f0" stroke-width="1.2" opacity="0.8" />
          <line x1="-68" y1="0" x2="68" y2="0" stroke="#e2e8f0" stroke-width="1.2" opacity="0.8" />
          <line x1="-48" y1="-48" x2="48" y2="48" stroke="#cbd5e1" stroke-width="1" opacity="0.7" />
          <line x1="-48" y1="48" x2="48" y2="-48" stroke="#cbd5e1" stroke-width="1" opacity="0.7" />
          <line x1="-26" y1="-63" x2="26" y2="63" stroke="#cbd5e1" stroke-width="0.9" opacity="0.65" />
          <line x1="-63" y1="-26" x2="63" y2="26" stroke="#cbd5e1" stroke-width="0.9" opacity="0.65" />
          <line x1="-63" y1="26" x2="63" y2="-26" stroke="#cbd5e1" stroke-width="0.9" opacity="0.65" />
          <line x1="-26" y1="63" x2="26" y2="-63" stroke="#cbd5e1" stroke-width="0.9" opacity="0.65" />
          <!-- Hub -->
          <circle cx="0" cy="0" r="9" fill="url(#chromeGrad)" stroke="#64748b" stroke-width="1.5" />
          <circle cx="0" cy="0" r="4" fill="#0f172a" />
          <!-- Tire Valve -->
          <rect x="-1.5" y="-58" width="3" height="7" fill="#0f172a" />
          <!-- Amber Reflector on spokes -->
          <rect x="22" y="-8" width="16" height="8" rx="2" fill="#f59e0b" stroke="#b45309" stroke-width="1" />
        </g>
      </defs>

      <!-- LAYER 0: Sky Background -->
      <rect id="skyRect" x="0" y="0" width="1000" height="620" fill="url(#skySunset)" />

      <!-- LAYER 1: Sun / Moon and Atmospheric Celestial Elements -->
      <g id="celestialGroup">
        <!-- Sun (visible in day/sunset) -->
        <g id="sunElement" transform="translate(780, 180)">
          <circle cx="0" cy="0" r="50" fill="#fef08a" opacity="0.95" filter="drop-shadow(0 0 35px #f59e0b)" />
          <circle cx="0" cy="0" r="75" fill="#fde047" opacity="0.25" />
        </g>
        <!-- Moon (visible in night) -->
        <g id="moonElement" transform="translate(800, 140)" style="display: none;">
          <circle cx="0" cy="0" r="38" fill="#f8fafc" opacity="0.9" filter="drop-shadow(0 0 20px #93c5fd)" />
          <path d="M-10 -30 A 38 38 0 0 0 26 30 A 34 34 0 1 1 -10 -30" fill="#0b1329" />
          <!-- Stars -->
          <g id="starsGroup" opacity="0.8">
            <circle cx="-320" cy="-60" r="1.5" fill="#ffffff" />
            <circle cx="-250" cy="-20" r="2" fill="#bae6fd" />
            <circle cx="-180" cy="-80" r="1.5" fill="#ffffff" />
            <circle cx="-120" cy="-30" r="1" fill="#ffffff" />
            <circle cx="-450" cy="-70" r="2" fill="#fed7aa" />
            <circle cx="-540" cy="-40" r="1.5" fill="#ffffff" />
            <circle cx="-620" cy="-85" r="1.8" fill="#ffffff" />
            <circle cx="-680" cy="-25" r="1.2" fill="#bae6fd" />
          </g>
        </g>
      </g>

      <!-- LAYER 2: Drifting Clouds (Parallax Far) -->
      <g id="cloudsGroup">
        <path d="M50 140 q20 -25 50 -15 q30 -30 65 -15 q40 -20 70 5 q25 -10 50 10 q15 25 -15 35 h-200 q-25 -5 -20 -20 z" fill="#ffffff" opacity="0.4" />
        <path d="M420 90 q25 -30 60 -15 q35 -25 75 -5 q30 -15 60 10 q20 20 -10 30 h-170 q-20 -5 -15 -20 z" fill="#ffffff" opacity="0.32" />
        <path d="M720 120 q20 -20 45 -10 q25 -25 55 -10 q30 -15 50 5 q20 15 -10 25 h-130 q-15 -3 -10 -10 z" fill="#ffffff" opacity="0.45" />
      </g>

      <!-- LAYER 3: Distant Ocean Horizon & Moving Wave Crests -->
      <g id="seaGroup">
        <rect x="0" y="320" width="1000" height="150" fill="url(#seaGrad)" />
        <!-- Wave crest lines parallax group -->
        <g id="waveParallax">
          <path id="wavePath1" d="M-200 340 Q-150 334 -100 340 T0 340 T100 340 T200 340 T300 340 T400 340 T500 340 T600 340 T700 340 T800 340 T900 340 T1000 340 T1100 340 T1200 340" fill="none" stroke="#e0f2fe" stroke-width="2" opacity="0.45" />
          <path id="wavePath2" d="M-200 365 Q-140 358 -80 365 T40 365 T160 365 T280 365 T400 365 T520 365 T640 365 T760 365 T880 365 T1000 365 T1120 365 T1240 365" fill="none" stroke="#bae6fd" stroke-width="2.5" opacity="0.5" />
          <path id="wavePath3" d="M-200 395 Q-130 388 -60 395 T80 395 T220 395 T360 395 T500 395 T640 395 T780 395 T920 395 T1060 395 T1200 395" fill="none" stroke="#7dd3fc" stroke-width="3" opacity="0.6" />
        </g>
        <!-- Distant Lighthouse on Jetty -->
        <g id="lighthouseGroup" transform="translate(140, 245)">
          <!-- Jetty rocks -->
          <path d="M-40 85 Q0 78 40 85 L35 95 L-45 95 Z" fill="#334155" />
          <!-- Tower -->
          <polygon points="-12,85 12,85 7,20 -7,20" fill="#f8fafc" stroke="#64748b" stroke-width="1" />
          <polygon points="-10,65 10,65 8,45 -8,45" fill="#ef4444" />
          <rect x="-10" y="15" width="20" height="6" fill="#0f172a" rx="1" />
          <!-- Lantern Room & Dome -->
          <rect x="-7" y="5" width="14" height="10" fill="#fef08a" opacity="0.9" />
          <path d="M-8 5 Q0 -2 8 5 Z" fill="#0f172a" />
          <!-- Rotating Light Beam -->
          <polygon id="lighthouseBeam" points="0,10 420,-30 400,60" fill="#fef08a" opacity="0.25" />
        </g>
        <!-- Distant Sailboat -->
        <g id="distantBoat" transform="translate(680, 298)">
          <path d="M0 16 L28 16 L24 24 L4 24 Z" fill="#ffffff" />
          <line x1="14" y1="2" x2="14" y2="16" stroke="#475569" stroke-width="1.5" />
          <polygon points="15,3 26,14 15,14" fill="#f8fafc" />
          <polygon points="13,5 3,14 13,14" fill="#38bdf8" />
        </g>
      </g>

      <!-- LAYER 4: Seaside Promenade Boardwalk / Pier Railing (Midground Parallax) -->
      <g id="railingParallaxGroup">
        <!-- Repeating Pier Fence Posts & Rails -->
        <g id="railingRepeat">
          <!-- Top rail -->
          <line x1="-200" y1="418" x2="1200" y2="418" stroke="#cbd5e1" stroke-width="5" stroke-linecap="round" />
          <!-- Mid rail -->

<script>
  /**
   * Pelican Coast Cruiser - 2D SVG Animation & Kinematics Engine
   * High performance requestAnimationFrame loop with full 2-bone Inverse Kinematics (IK),
   * parallax scenery scrolling, and synthetic Web Audio sound synthesis.
   */

  // --- AUDIO SYNTHESIS MODULE (Web Audio API) ---
  let audioCtx = null;
  let soundEnabled = true;

  function initAudio() {
    if (!audioCtx) {
      const AudioContextClass = window.AudioContext || window.webkitAudioContext;
      if (AudioContextClass) {
        audioCtx = new AudioContextClass();
      }
    }
    if (audioCtx && audioCtx.state === 'suspended') {
      audioCtx.resume();
    }
  }

  // Play bicycle brass bell dual chime ("Ding-Ding!")
  function playBikeBell() {
    if (!soundEnabled) return;
    initAudio();
    if (!audioCtx) return;

    const now = audioCtx.currentTime;

    // Harmonic partials for authentic resonant brass bell chime
    const bellFrequencies = [
      { freq: 2040, decay: 0.6, gain: 0.28 },
      { freq: 2480, decay: 0.5, gain: 0.22 },
      { freq: 4120, decay: 0.25, gain: 0.12 }
    ];

    function chime(timeOffset, volumeMultiplier) {
      bellFrequencies.forEach(partial => {
        const osc = audioCtx.createOscillator();
        const gainNode = audioCtx.createGain();

        osc.type = 'sine';
        osc.frequency.setValueAtTime(partial.freq, now + timeOffset);

        gainNode.gain.setValueAtTime(0, now + timeOffset);
        gainNode.gain.linearRampToValueAtTime(partial.gain * volumeMultiplier, now + timeOffset + 0.003);
        gainNode.gain.exponentialRampToValueAtTime(0.0001, now + timeOffset + partial.decay);

        osc.connect(gainNode);
        gainNode.connect(audioCtx.destination);

        osc.start(now + timeOffset);
        osc.stop(now + timeOffset + partial.decay);
      });
    }

    // First Ding
    chime(0, 1.0);
    // Second Ding (higher strike velocity)
    chime(0.12, 1.15);
  }

  // Play comical pelican throat honk / squawk
  function playPelicanHonk() {
    if (!soundEnabled) return;
    initAudio();
    if (!audioCtx) return;

    const now = audioCtx.currentTime;
    const osc = audioCtx.createOscillator();
    const filter = audioCtx.createBiquadFilter();
    const gainNode = audioCtx.createGain();

    osc.type = 'sawtooth';
    // Frequency drop for comical cartoon throat sound
    osc.frequency.setValueAtTime(175, now);
    osc.frequency.exponentialRampToValueAtTime(85, now + 0.28);

    // Formant vocal filter
    filter.type = 'bandpass';
    filter.frequency.setValueAtTime(680, now);
    filter.Q.setValueAtTime(3.5, now);

    gainNode.gain.setValueAtTime(0, now);
    gainNode.gain.linearRampToValueAtTime(0.35, now + 0.02);
    gainNode.gain.exponentialRampToValueAtTime(0.001, now + 0.3);

    osc.connect(filter);
    filter.connect(gainNode);
    gainNode.connect(audioCtx.destination);

    osc.start(now);
    osc.stop(now + 0.32);
  }

  // UI Toast notification
  const soundToast = document.getElementById('soundToast');
  const toastIcon = document.getElementById('toastIcon');
  const toastMsg = document.getElementById('toastMsg');
  let toastTimeout = null;

  function showToast(icon, text) {
    toastIcon.textContent = icon;
    toastMsg.textContent = text;
    soundToast.classList.add('show');
    clearTimeout(toastTimeout);
    toastTimeout = setTimeout(() => {
      soundToast.classList.remove('show');
    }, 1400);
  }

  // --- SCENE & SVG KINEMATICS ENGINE ---
  const state = {
    speed: 1.0,               // Multiplier: 0 (paused), 0.5 (chill), 1.0 (cruise), 2.2 (sprint)
    targetSpeed: 1.0,
    cadence: 4.2,             // Base angular velocity (rad/s)
    crankAngle: 0,
    wheelAngle: 0,
    timeOfDay: 'sunset',      // 'dawn', 'noon', 'sunset', 'night'
    hat: 'sailor',            // 'sailor', 'beret', 'goggles'
    cargo: 'fish',            // 'fish', 'baguette'
    pouchStretch: 0,          // 0 to 1 for jiggle/honk deformation
    blinkTimer: 2.0,
    blinkProgress: 0,
    sceneryOffsetFar: 0,
    sceneryOffsetMid: 0,
    sceneryOffsetNear: 0,
    fishJiggleAngle: 0,
    lastTime: performance.now()
  };

  // Fixed Anchor Points & Geometry Dimensions
  const GEOM = {
    // Crank center
    crankX: 450,
    crankY: 460,
    crankR: 32,
    // Pelican Hip position (relative to saddle)
    hipBaseX: 395,
    hipBaseY: 310,
    // Leg segment lengths for 2-bone Inverse Kinematics (IK)
    thighLen: 98,
    shinLen: 96,
    // Wheelbase
    rearWheelX: 280,
    frontWheelX: 660,
    wheelsY: 460
  };

  // DOM Elements cache
  const dom = {
    canvasWrapper: document.getElementById('canvasWrapper'),
    skyRect: document.getElementById('skyRect'),
    sunElement: document.getElementById('sunElement'),
    moonElement: document.getElementById('moonElement'),
    lighthouseBeam: document.getElementById('lighthouseBeam'),
    wavePath1: document.getElementById('wavePath1'),
    wavePath2: document.getElementById('wavePath2'),
    wavePath3: document.getElementById('wavePath3'),
    fencePosts: document.getElementById('fencePosts'),
    speedDash1: document.getElementById('speedDash1'),
    speedDash2: document.getElementById('speedDash2'),
    seagullGroup: document.getElementById('seagullGroup'),
    gullWingLeft: document.getElementById('gullWingLeft'),
    gullWingRight: document.getElementById('gullWingRight'),
    // Bicycle Parts
    rearSpokesRotator: document.getElementById('rearSpokesRotator'),
    frontSpokesRotator: document.getElementById('frontSpokesRotator'),
    saddleGroup: document.getElementById('saddleGroup'),
    bicycleLightCone: document.getElementById('bicycleLightCone'),
    bikeBellGroup: document.getElementById('bikeBellGroup'),
    bellDome: document.getElementById('bellDome'),
    bellNotes: document.getElementById('bellNotes'),
    // Legs & Cranks
    nearCrankArm: document.getElementById('nearCrankArm'),
    nearPedalPlatform: document.getElementById('nearPedalPlatform'),
    nearThigh: document.getElementById('nearThigh'),
    nearShin: document.getElementById('nearShin'),
    nearKneeJoint: document.getElementById('nearKneeJoint'),
    nearFootGroup: document.getElementById('nearFootGroup'),
    farCrankArm: document.getElementById('farCrankArm'),
    farPedalBlock: document.getElementById('farPedalBlock'),
    farThigh: document.getElementById('farThigh'),
    farShin: document.getElementById('farShin'),
    farFoot: document.getElementById('farFoot'),
    // Pelican Body & Head
    pelicanRiderBody: document.getElementById('pelicanRiderBody'),
    pelicanHeadGroup: document.getElementById('pelicanHeadGroup'),
    pelicanNeck: document.getElementById('pelicanNeck'),
    pelicanTail: document.getElementById('pelicanTail'),
    pelicanPouch: document.getElementById('pelicanPouch'),
    pelicanEyelid: document.getElementById('pelicanEyelid'),
    sailorScarf: document.getElementById('sailorScarf'),
    // Hats
    hatSailorCap: document.getElementById('hatSailorCap'),
    hatBeret: document.getElementById('hatBeret'),
    hatGoggles: document.getElementById('hatGoggles'),
    // Cargo
    cargoFish: document.getElementById('cargoFish'),
    cargoBaguette: document.getElementById('cargoBaguette'),
    cargoIcon: document.getElementById('cargoIcon'),
    fishBody: document.getElementById('fishBody'),
    fishTail: document.getElementById('fishTail'),
    fishBubble: document.getElementById('fishBubble')
  };

  // Generate Fence Posts for Parallax Railing
  function initFencePosts() {
    let html = '';
    for (let x = -200; x <= 1200; x += 110) {
      html += `<rect x="${x}" y="415" width="10" height="55" fill="#475569" rx="1.5" />`;
      html += `<rect x="${x - 2}" y="413" width="14" height="6" fill="#64748b" rx="1" />`;
    }
    dom.fencePosts.innerHTML = html;
  }
  initFencePosts();

  /**
   * 2D Two-Bone Inverse Kinematics (IK) Solver
   * Computes exact knee position given Hip (origin) and Ankle (target).
   */
  function solve2BoneIK(hipX, hipY, ankleX, ankleY, L1, L2, bendForward = true) {
    const dx = ankleX - hipX;
    const dy = ankleY - hipY;
    let dist = Math.hypot(dx, dy);

    // Clamp distance within reach limits
    const maxReach = (L1 + L2) * 0.999;
    const minReach = Math.abs(L1 - L2) * 1.05;
    dist = Math.max(minReach, Math.min(maxReach, dist));

    // Base angle from hip to ankle
    const baseAngle = Math.atan2(dy, dx);

    // Law of Cosines for thigh angle offset
    const cosThigh = (L1 * L1 + dist * dist - L2 * L2) / (2 * L1 * dist);
    const clampedCos = Math.max(-1, Math.min(1, cosThigh));
    const thighOffset = Math.acos(clampedCos);

    const kneeAngle = bendForward ? (baseAngle - thighOffset) : (baseAngle + thighOffset);

    const kneeX = hipX + L1 * Math.cos(kneeAngle);
    const kneeY = hipY + L1 * Math.sin(kneeAngle);

    return { kneeX, kneeY };
  }

  /**
   * Main Render Loop (Executed each frame via requestAnimationFrame)
   */
  function animate(now) {
    const dt = Math.min((now - state.lastTime) / 1000, 0.1); // Clamp delta time to avoid jumps
    state.lastTime = now;

    // Smooth speed interpolation
    state.speed += (state.targetSpeed - state.speed) * Math.min(dt * 8, 1);

    const effectiveCadence = state.cadence * state.speed;

    if (state.speed > 0.001) {
      // Advance crank angle (clockwise)
      state.crankAngle = (state.crankAngle + effectiveCadence * dt) % (Math.PI * 2);

      // Wheel rotation (Gear ratio ~2.2x wheel turns per crank turn)
      state.wheelAngle = (state.wheelAngle + effectiveCadence * 2.2 * dt) % (Math.PI * 2);

      // Scenery Parallax Progression
      state.sceneryOffsetNear = (state.sceneryOffsetNear + state.speed * 420 * dt) % 1000;
      state.sceneryOffsetMid = (state.sceneryOffsetMid + state.speed * 180 * dt) % 110;
      state.sceneryOffsetFar = (state.sceneryOffsetFar + state.speed * 45 * dt) % 1000;
    }

    // --- 1. UPDATE WHEELS ROTATION ---
    const wheelDeg = (state.wheelAngle * 180 / Math.PI) % 360;
    dom.rearSpokesRotator.setAttribute('transform', `rotate(${wheelDeg})`);
    dom.frontSpokesRotator.setAttribute('transform', `rotate(${wheelDeg})`);

    // --- 2. UPDATE SCENERY PARALLAX ---
    // Moving speed road markings
    dom.speedDash1.setAttribute('stroke-dashoffset', -state.sceneryOffsetNear);
    dom.speedDash2.setAttribute('stroke-dashoffset', -state.sceneryOffsetNear * 1.3);

    // Pier fence posts parallax
    dom.fencePosts.setAttribute('transform', `translate(${-state.sceneryOffsetMid}, 0)`);

    // Water wave crests subtle horizontal undulating
    const waveShift1 = (state.sceneryOffsetFar * 1.6) % 200;
    const waveShift2 = (state.sceneryOffsetFar * 2.2) % 240;
    const waveShift3 = (state.sceneryOffsetFar * 3.0) % 280;
    dom.wavePath1.setAttribute('transform', `translate(${-waveShift1}, 0)`);
    dom.wavePath2.setAttribute('transform', `translate(${-waveShift2}, 0)`);
    dom.wavePath3.setAttribute('transform', `translate(${-waveShift3}, 0)`);

    // Flying companion seagull wing flapping & hovering
    const flapRate = now * 0.008 * (0.8 + state.speed * 0.4);
    const wingAngle = Math.sin(flapRate) * 26;
    dom.gullWingLeft.setAttribute('transform', `rotate(${wingAngle} 0 0)`);
    dom.gullWingRight.setAttribute('transform', `rotate(${-wingAngle} 0 0)`);
    const gullHoverY = Math.sin(now * 0.002) * 12;
    dom.seagullGroup.setAttribute('transform', `translate(320, ${110 + gullHoverY})`);

    // Lighthouse beam slow 360 sweep
    const lighthouseAngle = Math.sin(now * 0.001) * 35;
    dom.lighthouseBeam.setAttribute('transform', `rotate(${lighthouseAngle} 0 10)`);

    // --- 3. BIKE TORQUE & SADDLE BOBBING ---
    // When pedaling, body and saddle bounce slightly twice per crank cycle
    const pedalingBob = Math.sin(state.crankAngle * 2) * (3.5 * state.speed);
    const sprintLean = state.speed > 1.8 ? 5 : 0; // Leaning forward when sprinting

    dom.saddleGroup.setAttribute('transform', `translate(385, ${275 + pedalingBob * 0.4})`);
    dom.pelicanRiderBody.setAttribute('transform', `translate(${sprintLean}, ${pedalingBob})`);

    // --- 4. INVERSE KINEMATICS FOR LEGS & PEDALS ---
    const hipX = GEOM.hipBaseX + sprintLean;
    const hipY = GEOM.hipBaseY + pedalingBob;

    // NEAR SIDE CRANK (foreground)
    const nearPedalX = GEOM.crankX + GEOM.crankR * Math.cos(state.crankAngle);
    const nearPedalY = GEOM.crankY + GEOM.crankR * Math.sin(state.crankAngle);

    // Near Crank Arm line & Pedal Platform
    dom.nearCrankArm.setAttribute('x2', nearPedalX);
    dom.nearCrankArm.setAttribute('y2', nearPedalY);
    dom.nearPedalPlatform.setAttribute('x', nearPedalX - 15);
    dom.nearPedalPlatform.setAttribute('y', nearPedalY - 4);

    // Near Ankle connects to near pedal
    const nearAnkleX = nearPedalX;
    const nearAnkleY = nearPedalY - 6;

    // Solve Near Knee IK
    const nearIK = solve2BoneIK(hipX, hipY, nearAnkleX, nearAnkleY, GEOM.thighLen, GEOM.shinLen, true);

    // Render Near Leg
    dom.nearThigh.setAttribute('d', `M${hipX} ${hipY} L${nearIK.kneeX} ${nearIK.kneeY}`);
    dom.nearKneeJoint.setAttribute('cx', nearIK.kneeX);
    dom.nearKneeJoint.setAttribute('cy', nearIK.kneeY);
    dom.nearShin.setAttribute('d', `M${nearIK.kneeX} ${nearIK.kneeY} L${nearAnkleX} ${nearAnkleY}`);
    dom.nearFootGroup.setAttribute('transform', `translate(${nearAnkleX}, ${nearAnkleY})`);

    // FAR SIDE CRANK (180 degrees offset, background)
    const farAngle = state.crankAngle + Math.PI;
    const farPedalX = GEOM.crankX + GEOM.crankR * Math.cos(farAngle);
    const farPedalY = GEOM.crankY + GEOM.crankR * Math.sin(farAngle);

    dom.farCrankArm.setAttribute('x2', farPedalX);
    dom.farCrankArm.setAttribute('y2', farPedalY);
    dom.farPedalBlock.setAttribute('x', farPedalX - 12);
    dom.farPedalBlock.setAttribute('y', farPedalY - 3.5);

    const farAnkleX = farPedalX;
    const farAnkleY = farPedalY - 6;

    // Solve Far Knee IK
    const farIK = solve2BoneIK(hipX, hipY, farAnkleX, farAnkleY, GEOM.thighLen, GEOM.shinLen, true);

    dom.farThigh.setAttribute('d', `M${hipX} ${hipY} L${farIK.kneeX} ${farIK.kneeY}`);
    dom.farShin.setAttribute('d', `M${farIK.kneeX} ${farIK.kneeY} L${farAnkleX} ${farAnkleY}`);
    dom.farFoot.setAttribute('points', `${farAnkleX - 12},${farAnkleY} ${farAnkleX + 26},${farAnkleY} ${farAnkleX + 32},${farAnkleY + 7} ${farAnkleX - 8},${farAnkleY + 7}`);

    // --- 5. SECONDARY ORGANIC ANIMATIONS (Head, Pouch, Scarf, Eye) ---
    // Head bobs slightly out of phase with the body for lifelike rhythm
    const headBobX = Math.cos(state.crankAngle * 2 - 0.5) * (1.8 * state.speed);
    const headBobY = Math.sin(state.crankAngle * 2 - 0.5) * (2.2 * state.speed);
    dom.pelicanHeadGroup.setAttribute('transform', `translate(${485 + headBobX}, ${110 + headBobY})`);

    // Tail feather bob
    const tailAngle = Math.sin(state.crankAngle * 2) * 5;
    dom.pelicanTail.setAttribute('transform', `translate(325, 260) rotate(${tailAngle})`);

    // Scarf fluttering in headwind
    const scarfFlutter = Math.sin(now * 0.015 * (1 + state.speed * 0.8)) * (12 + state.speed * 8);
    dom.sailorScarf.setAttribute('transform', `translate(442, 175) rotate(${scarfFlutter})`);

    // Gular Pouch physics jiggle & stretch on honk
    if (state.pouchStretch > 0) {
      state.pouchStretch = Math.max(0, state.pouchStretch - dt * 2.8);
    }
    const pouchJiggle = Math.sin(state.crankAngle * 2 + 0.8) * (2 * state.speed) + (state.pouchStretch * 32);
    const pouchDropY = 50 + pouchJiggle;
    dom.pelicanPouch.setAttribute('d', `M18 10 C35 60 70 ${85 + pouchJiggle * 1.2} 110 ${pouchDropY} C125 35 140 20 148 10 C100 16 55 18 18 10 Z`);

    // Eye blinking logic
    state.blinkTimer -= dt;
    if (state.blinkTimer <= 0) {
      state.blinkProgress += dt * 10;
      const blinkY = Math.sin(Math.min(state.blinkProgress, Math.PI));
      dom.pelicanEyelid.style.transform = `scaleY(${blinkY})`;
      if (state.blinkProgress >= Math.PI) {
        state.blinkProgress = 0;
        state.blinkTimer = 2.5 + Math.random() * 4.0;
        dom.pelicanEyelid.style.transform = `scaleY(0)`;
      }
    }

    // Fish in Basket wiggles happily
    state.fishJiggleAngle = Math.sin(now * 0.009 * (1 + state.speed * 0.5)) * 14;
    dom.fishTail.setAttribute('transform', `rotate(${state.fishJiggleAngle * 1.5} -10 0)`);
    dom.cargoFish.setAttribute('transform', `translate(26, ${-6 + Math.sin(now * 0.006) * 3}) rotate(${state.fishJiggleAngle * 0.4})`);

    requestAnimationFrame(animate);
  }

  // Start Animation Engine
  requestAnimationFrame(animate);

  // --- TIME OF DAY / ATMOSPHERE SWITCHER ---
  const timePresets = {
    dawn: {
      sky: 'url(#skyDawn)',
      sun: true,
      moon: false,
      sunY: 210,
      sunFilter: 'drop-shadow(0 0 45px #f43f5e)',
      headlight: 0.15
    },
    noon: {
      sky: 'url(#skyNoon)',
      sun: true,
      moon: false,
      sunY: 100,
      sunFilter: 'drop-shadow(0 0 35px #fde047)',
      headlight: 0
    },
    sunset: {
      sky: 'url(#skySunset)',
      sun: true,
      moon: false,
      sunY: 180,
      sunFilter: 'drop-shadow(0 0 40px #f59e0b)',
      headlight: 0.4
    },
    night: {
      sky: 'url(#skyNight)',
      sun: false,
      moon: true,
      headlight: 0.92
    }
  };

  function setTimeOfDay(timeKey) {
    state.timeOfDay = timeKey;
    const config = timePresets[timeKey] || timePresets.sunset;

    dom.skyRect.setAttribute('fill', config.sky);

    if (config.sun) {
      dom.sunElement.style.display = 'block';
      dom.sunElement.setAttribute('transform', `translate(780, ${config.sunY})`);
    } else {
      dom.sunElement.style.display = 'none';
    }

    dom.moonElement.style.display = config.moon ? 'block' : 'none';
    dom.bicycleLightCone.style.opacity = config.headlight;

    // Update buttons UI
    document.querySelectorAll('[data-time]').forEach(btn => {
      btn.classList.toggle('active', btn.dataset.time === timeKey);
    });
  }

  // --- ACCESSORY / HAT SWITCHER ---
  function setHat(hatKey) {
    state.hat = hatKey;
    dom.hatSailorCap.style.display = hatKey === 'sailor' ? 'block' : 'none';
    dom.hatBeret.style.display = hatKey === 'beret' ? 'block' : 'none';
    dom.hatGoggles.style.display = hatKey === 'goggles' ? 'block' : 'none';

    document.querySelectorAll('[data-hat]').forEach(btn => {
      btn.classList.toggle('active', btn.dataset.hat === hatKey);
    });
  }

  // --- BASKET CARGO TOGGLE ---
  function toggleCargo() {
    state.cargo = state.cargo === 'fish' ? 'baguette' : 'fish';
    if (state.cargo === 'fish') {
      dom.cargoFish.style.display = 'block';
      dom.cargoBaguette.style.display = 'none';
      dom.cargoIcon.textContent = '🐟';
      showToast('🐟', '篮子里是新鲜小银鱼！');
    } else {
      dom.cargoFish.style.display = 'none';
      dom.cargoBaguette.style.display = 'block';
      dom.cargoIcon.textContent = '🥖';
      showToast('🥖', '换成了刚出炉的法棍面包！');
    }
  }

  // --- INTERACTIVE ACTIONS ---
  // Ring Bell
  function ringBell() {
    playBikeBell();
    showToast('🔔', '叮叮！清脆的车铃响声！');

    // Button animation
    const btn = document.getElementById('ringBellBtn');
    btn.classList.add('bell-ringing');
    setTimeout(() => btn.classList.remove('bell-ringing'), 450);

    // SVG Bell visual shake & musical note ping
    dom.bellDome.setAttribute('transform', 'rotate(-20)');
    dom.bellNotes.style.opacity = '1';
    setTimeout(() => {
      dom.bellDome.setAttribute('transform', 'rotate(18)');
    }, 120);
    setTimeout(() => {
      dom.bellDome.setAttribute('transform', 'rotate(0)');
      dom.bellNotes.style.opacity = '0';
    }, 550);
  }

  // Pelican Honk & Gular Pouch Stretch
  function triggerHonk() {
    playPelicanHonk();
    showToast('📯', '嘎——！鹈鹕欢快地大叫！');

    state.pouchStretch = 1.0;

    // Small wink reaction
    dom.pelicanEyelid.style.transform = 'scaleY(1)';
    setTimeout(() => {
      dom.pelicanEyelid.style.transform = 'scaleY(0)';
    }, 320);
  }

  // --- EVENT LISTENERS ---
  // Speed buttons
  document.querySelectorAll('[data-speed]').forEach(btn => {
    btn.addEventListener('click', () => {
      const speedVal = parseFloat(btn.dataset.speed);
      state.targetSpeed = speedVal;
      document.querySelectorAll('[data-speed]').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');

      const labels = {
        0: '骑行已暂停',
        0.5: '悠闲慢行海风模式',
        1.0: '标准舒适巡航模式',
        2.2: '极速全力冲刺！'
      };
      showToast('⚡', labels[speedVal] || '速度已调整');
    });
  });

  // Time buttons
  document.querySelectorAll('[data-time]').forEach(btn => {
    btn.addEventListener('click', () => {
      setTimeOfDay(btn.dataset.time);
      const timeNames = { dawn: '晨曦海岸', noon: '晴朗正午', sunset: '金色黄昏', night: '静谧星夜' };
      showToast('🌅', `切换至：${timeNames[btn.dataset.time]}`);
    });
  });

  // Hat buttons
  document.querySelectorAll('[data-hat]').forEach(btn => {
    btn.addEventListener('click', () => {
      setHat(btn.dataset.hat);
      const hatNames = { sailor: '帅气水手帽', beret: '法式红贝雷帽', goggles: '复古飞行风镜' };
      showToast('🎩', `戴上：${hatNames[btn.dataset.hat]}`);
    });
  });

  // Action Buttons
  document.getElementById('ringBellBtn').addEventListener('click', ringBell);
  document.getElementById('honkPouchBtn').addEventListener('click', triggerHonk);
  document.getElementById('toggleCargoBtn').addEventListener('click', toggleCargo);

  // Direct Click on SVG canvas
  dom.canvasWrapper.addEventListener('click', (e) => {
    // If clicked on bell area
    const rect = dom.canvasWrapper.getBoundingClientRect();
    const clickXRel = (e.clientX - rect.left) / rect.width * 1000;
    const clickYRel = (e.clientY - rect.top) / rect.height * 620;

    if (Math.hypot(clickXRel - 548, clickYRel - 204) < 36) {
      ringBell();
    } else if (clickXRel > 460 && clickXRel < 650 && clickYRel > 80 && clickYRel < 200) {
      triggerHonk();
    } else if (clickXRel > 610 && clickXRel < 680 && clickYRel > 190 && clickYRel < 270) {
      toggleCargo();
    } else {
      // Toggle between ring bell and honk
      if (Math.random() > 0.5) ringBell();
      else triggerHonk();
    }
  });

  // Sound Toggle Button
  const toggleSoundBtn = document.getElementById('toggleSoundBtn');
  const soundIcon = document.getElementById('soundIcon');
  const soundText = document.getElementById('soundText');

  toggleSoundBtn.addEventListener('click', () => {
    soundEnabled = !soundEnabled;
    if (soundEnabled) {
      initAudio();
      soundIcon.textContent = '🔊';
      soundText.textContent = '音效开';
      showToast('🔊', '音效已开启');
      playBikeBell();
    } else {
      soundIcon.textContent = '🔇';
      soundText.textContent = '已静音';
      showToast('🔇', '音效已静音');
    }
  });

  // Theme Toggle Button
  const themeToggleBtn = document.getElementById('themeToggleBtn');
  let currentTheme = 'dark';

  themeToggleBtn.addEventListener('click', () => {
    currentTheme = currentTheme === 'dark' ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', currentTheme);
    showToast(currentTheme === 'dark' ? '🌙' : '☀️', `已切换至${currentTheme === 'dark' ? '暗色' : '亮色'}界面`);
  });

  // Keyboard Shortcuts
  window.addEventListener('keydown', (e) => {
    if (e.code === 'Space') {
      e.preventDefault();
      triggerHonk();
    } else if (e.key === 'b' || e.key === 'B') {
      ringBell();
    } else if (e.key === '1') {
      document.querySelector('[data-speed="0.5"]').click();
    } else if (e.key === '2') {
      document.querySelector('[data-speed="1.0"]').click();
    } else if (e.key === '3') {
      document.querySelector('[data-speed="2.2"]').click();
    }
  });
</script>
