<!DOCTYPE html>

<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>鹈鹕的海边骑行</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f1e7;color:#294e50;font-family:Arial,"Microsoft YaHei",sans-serif;min-height:100vh;display:grid;place-items:center}main{width:min(1100px,94vw);padding:35px 0}header{display:flex;align-items:end;justify-content:space-between;padding:0 20px 24px}.eyebrow{font-size:11px;letter-spacing:4px;color:#758682}h1{font-weight:500;font-size:clamp(25px,4vw,42px);margin:12px 0 0;letter-spacing:3px}.tag{font-size:12px;letter-spacing:2px}svg{display:block;width:100%;height:auto;border-radius:24px;background:#dcece7}footer{display:flex;align-items:center;justify-content:space-between;padding:22px 14px;font-size:12px;color:#73817a}.controls{display:flex;gap:10px}button{border:1px solid #bac9bd;border-radius:30px;padding:10px 18px;color:#294e50;background:transparent;cursor:pointer}button:hover{background:#e1e8dd}button:focus-visible{outline:3px solid #dc8855} @media(max-width:550px){.tag{display:none}footer{gap:15px;align-items:start}footer>span{max-width:140px;line-height:1.7}}
</style></head>
<body><main><header><div><div class="eyebrow">THE LITTLE COASTAL CLUB</div><h1>风刚好，慢慢骑。</h1></div><span class="tag">PELICAN / AFTERNOON RIDE</span></header>

<footer><span>海风作伴，今天也不赶时间。</span><div class="controls"><button id="pause" type="button">暂停动画</button><button id="speed" type="button">速度 ×1</button></div></footer></main>
<script>
const $=id=>document.getElementById(id);let running=!matchMedia('(prefers-reduced-motion: reduce)').matches,speed=1,time=0,last=null;
function draw(t){const a=t*3.4,bob=Math.sin(a*2)*2,deg=a*180/Math.PI;for(const id of ['rearWheel','frontWheel'])$(id).setAttribute('transform',`rotate(${deg})`);$('bird').setAttribute('transform',`translate(0 ${bob})`);$('scarfTail').setAttribute('transform',`rotate(${Math.sin(a*2)*4} 515 210)`);$('crank').setAttribute('transform',`rotate(${deg} 507 449)`);
function leg(phase,near){let x=507+30*Math.cos(phase),y=449+30*Math.sin(phase),hipX=near?480:465,hipY=(near?314:315)+bob,kx=hipX+27+12*Math.cos(phase-.6),ky=378+7*Math.sin(phase);let d=`M${hipX} ${hipY}L${kx} ${ky}L${x} ${y}`;if(near){$('nearLeg').setAttribute('d',d);$('nearLegFill').setAttribute('d',d);let foot=`M${x-8} ${y}h29l-9-7`;$('nearFoot').setAttribute('d',foot);$('nearFootFill').setAttribute('d',foot);$('pedal').setAttribute('d',`M${x-12} ${y+7}h30`);}else{$('farLeg').setAttribute('d',d);$('farFoot').setAttribute('d',`M${x-8} ${y}h29`);}}
leg(a+Math.PI,false);leg(a,true);$('road').setAttribute('transform',`translate(${-((t*160)%250)} 0)`);$('plants').setAttribute('transform',`translate(${-((t*95)%1060)} 0)`);$('clouds').setAttribute('transform',`translate(${-((t*9)%1100)} 0)`);}
function frame(now){if(last!==null&&running)time+=Math.min((now-last)/1000,.05)*speed;last=now;draw(time);requestAnimationFrame(frame)}
$('pause').textContent=running?'暂停动画':'播放动画';$('pause').onclick=()=>{running=!running;$('pause').textContent=running?'暂停动画':'播放动画'};$('speed').onclick=()=>{speed=speed===1?1.5:speed===1.5?.5:1;$('speed').textContent=`速度 ×${speed}`};requestAnimationFrame(frame);
</script></body></html>
