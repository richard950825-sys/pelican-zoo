<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f7f3e9">
  <title>顺风骑行 · Pelican on wheels</title>
  <style>
    :root { color-scheme: light; --paper: #f7f3e9; --ink: #243f42; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100svh; background: var(--paper); color: var(--ink); font-family: "Avenir Next", "Segoe UI", sans-serif; }
    main { width: min(1120px, 100%); min-height: 100svh; margin: auto; padding: 38px 48px 25px; display: flex; flex-direction: column; }
    header, footer { display: flex; align-items: center; justify-content: space-between; gap: 20px; }
    .brand { font-size: 12px; font-weight: 700; letter-spacing: .19em; display: flex; align-items: center; gap: 11px; }
    .brand-mark { width: 23px; height: 23px; border: 1.5px solid; border-radius: 50%; display: grid; place-items: center; font-size: 16px; }
    .edition { font-size: 11px; letter-spacing: .13em; color: #778884; }
    .heading { margin-top: 53px; text-align: center; }
    .eyebrow { font-size: 10px; letter-spacing: .3em; color: #688b83; margin: 0 0 15px; }
    h1 { font-family: "Songti SC", "STSong", Georgia, serif; font-size: clamp(34px, 5vw, 54px); letter-spacing: .13em; font-weight: 500; margin: 0; }
    .subtitle { color: #7b8780; font-size: 13px; letter-spacing: .09em; margin: 17px 0 0; }
    .scene { width: 100%; margin: auto 0; }
    svg { width: 100%; height: auto; display: block; overflow: visible; }
    footer { border-top: 1px solid #dce1d5; padding-top: 19px; font-size: 11px; color: #758780; }
    .caption { letter-spacing: .09em; }
    button { font: inherit; color: var(--ink); border: 1px solid #bdcdc0; border-radius: 30px; padding: 9px 16px; background: transparent; cursor: pointer; display: flex; align-items: center; gap: 9px; }
    button:hover { background: #e8eee2; }
    button:focus-visible { outline: 3px solid #de9364; outline-offset: 4px; }
    .indicator { width: 6px; height: 6px; border-radius: 100%; background: #478b79; }
    .wheel { animation: spin 1.6s linear infinite; }
    .rear-wheel { transform-origin: 342px 390px; }
    .front-wheel { transform-origin: 668px 390px; }
    .crank { transform-origin: 482px 387px; animation: spin 1.6s linear infinite; }
    .rider { animation: bob .8s ease-in-out infinite; }
    .wing { transform-origin: 463px 241px; animation: flap 1.6s ease-in-out infinite; }
    .scarf-tail { transform-origin: 525px 216px; animation: flutter .8s ease-in-out infinite alternate; }
    .cloud-a { animation: drift 30s linear infinite; }
    .cloud-b { animation: drift 44s linear infinite; }
    .road { animation: road 1.6s linear infinite; }
    .breeze { animation: breeze 3s ease-in-out infinite; }
    .breeze.second { animation-delay: -1.5s; }
    .paused *, .paused *::before { animation-play-state: paused !important; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes bob { 50% { transform: translateY(3px) rotate(.3deg); } }
    @keyframes flap { 50% { transform: rotate(-5deg); } }
    @keyframes flutter { to { transform: rotate(7deg) scaleX(.94); } }
    @keyframes drift { from { transform: translateX(170px); } to { transform: translateX(-220px); } }
    @keyframes road { to { transform: translateX(-160px); } }
    @keyframes breeze { 0%, 100% { opacity: 0; transform: translateX(25px); } 40%, 65% { opacity: .7; } 80% { transform: translateX(-35px); } }
    @media (max-width: 600px) {
      main { padding: 25px 22px 22px; }
      .heading { margin-top: 64px; }
      .edition { font-size: 9px; letter-spacing: .05em; }
      .brand { font-size: 10px; letter-spacing: .1em; }
      .scene { width: calc(100% + 32px); margin-left: -16px; }
      .subtitle { font-size: 11px; }
      footer { font-size: 10px; }
    }
  </style>
</head>
<body>

      <div class="brand"><span class="brand-mark" aria-hidden="true">↗</span> LITTLE WANDER CLUB</div>
      <span class="edition">骑行日记 &nbsp; / &nbsp; No. 001</span>
    </header>

    <footer>
      <span class="caption">海岸线漫游 &nbsp; · &nbsp; 快乐不限速</span>
      <button id="toggle" type="button" aria-pressed="false"><span class="indicator" aria-hidden="true"></span><span id="toggle-label">暂停骑行</span></button>
    </footer>
  </main>
  <script>
    const scene = document.getElementById('ride');
    const toggle = document.getElementById('toggle');
    const label = document.getElementById('toggle-label');
    const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)');
    let paused = reducedMotion.matches;
    function renderPlayback() {
      document.body.classList.toggle('paused', paused);
      if (paused) scene.pauseAnimations();
      else scene.unpauseAnimations();
      toggle.setAttribute('aria-pressed', String(paused));
      label.textContent = paused ? '继续骑行' : '暂停骑行';
    }
    toggle.addEventListener('click', () => { paused = !paused; renderPlayback(); });
    reducedMotion.addEventListener('change', event => { paused = event.matches; renderPlayback(); });
    renderPlayback();
  </script>
<script data-pelican-scroll>window.addEventListener("load",function(){requestAnimationFrame(function(){var d=document.documentElement,b=document.body,w=Math.max(d.scrollWidth,b?b.scrollWidth:0),h=Math.max(d.scrollHeight,b?b.scrollHeight:0);window.scrollTo(Math.max(0,(w-window.innerWidth)/2),Math.max(0,(h-window.innerHeight)/2))})});</script></body>
