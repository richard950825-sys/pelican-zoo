<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f3f0e6">
  <title>顺风，慢骑。 · 螳螂的双人自行车</title>
  <style>
    :root {
      color-scheme: light;
      --paper: #f3f0e6;
      --ink: #2e483b;
      --muted: #7e8876;
      --line: #d6d8c9;
      --accent: #b85535;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-width: 320px;
      min-height: 100svh;
      background: var(--paper);
      color: var(--ink);
      font-family: "Avenir Next", "PingFang SC", "Microsoft YaHei", sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: .19;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.84' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Cpath fill='%23565743' opacity='.2' filter='url(%23n)' d='M0 0h180v180H0z'/%3E%3C/svg%3E");
      z-index: 5;
    }
    button, input { font: inherit; }
    button { -webkit-tap-highlight-color: transparent; }
    button:focus-visible, input:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 6px;
    }
    .page {
      max-width: 1512px;
      margin: 0 auto;
      min-height: 100svh;
      padding: 29px 56px 25px;
      display: flex;
      flex-direction: column;
    }
    .masthead {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-bottom: 20px;
      border-bottom: 1px solid var(--line);
    }
    .brand { display: flex; align-items: center; gap: 12px; }
    .brand-mark { width: 35px; height: 35px; }
    .brand-name { font-size: 13px; font-weight: 600; letter-spacing: .23em; }
    .brand-en { display: block; margin-top: 4px; font-size: 8px; letter-spacing: .25em; }
    .edition { font-size: 10px; letter-spacing: .17em; color: var(--muted); }
    .heading {
      display: flex;
      align-items: end;
      justify-content: space-between;
      padding: 37px 0 0;
      gap: 20px;
    }
    .eyebrow {
      margin: 0 0 11px;
      font-size: 10px;
      letter-spacing: .24em;
      color: var(--accent);
    }
    h1 {
      margin: 0;
      font-family: "Songti SC", "Noto Serif CJK SC", "STSong", serif;
      font-size: clamp(36px, 4.1vw, 61px);
      font-weight: 500;
      letter-spacing: .05em;
      line-height: 1.3;
    }
    .intro { margin: 0 2px 9px 0; font-size: 12px; line-height: 2; letter-spacing: .12em; color: #74806c; }
    .artwork { margin: -15px -25px -12px; flex: 1; display: grid; align-items: center; }
    .scene { display: block; width: 100%; height: auto; overflow: visible; }
    .footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      border-top: 1px solid var(--line);
      padding-top: 19px;
    }
    .caption { margin: 0; display: flex; align-items: center; gap: 12px; font-size: 11px; letter-spacing: .13em; color: #74806c; }
    .caption svg { width: 26px; height: 19px; flex-shrink: 0; }
    .controls { display: flex; align-items: center; gap: 22px; }
    .play-button {
      border: 0;
      background: transparent;
      color: var(--ink);
      cursor: pointer;
      display: flex;
      align-items: center;
      padding: 5px 0;
      gap: 10px;
      font-size: 11px;
      letter-spacing: .09em;
    }
    .play-disc {
      display: grid;
      place-items: center;
      width: 32px;
      height: 32px;
      border: 1px solid #879880;
      border-radius: 50%;
      transition: background .2s, color .2s;
    }
    .play-button:hover .play-disc { background: var(--ink); color: var(--paper); }
    .play-disc svg { width: 13px; height: 13px; }
    .tempo { display: flex; align-items: center; gap: 11px; padding-left: 22px; border-left: 1px solid var(--line); }
    .tempo label { font-size: 10px; color: #74806c; }
    .tempo input { width: 82px; height: 3px; accent-color: var(--ink); cursor: pointer; }
    .tempo output { width: 30px; font-size: 10px; font-variant-numeric: tabular-nums; }
    .play-icon { display: none; }
    [data-paused="true"] .pause-icon { display: none; }
    [data-paused="true"] .play-icon { display: block; }
    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; clip-path: inset(50%); overflow: hidden; white-space: nowrap; }
    @media (min-width: 1550px) { .page { padding-top: 40px; padding-bottom: 32px; } }
    @media (max-width: 700px) {
      .page { padding: 22px 23px; }
      .masthead { padding-bottom: 16px; }
      .brand-name { font-size: 11px; }
      .edition { font-size: 8px; letter-spacing: .06em; }
      .heading { padding-top: 31px; }
      .intro { font-size: 10px; letter-spacing: .02em; }
      .artwork { margin: 5px -17px 4px; min-height: 340px; }
      .footer { align-items: flex-start; flex-direction: column; gap: 18px; }
      .controls { width: 100%; justify-content: space-between; }
      .tempo input { width: 108px; }
    }
    @media (max-width: 400px) { .intro { display: none; } .edition { max-width: 85px; text-align: right; line-height: 1.8; } }
  </style>
</head>
<body>
  <main class="page">
    <header class="masthead">
      <div class="brand">
        <svg class="brand-mark" viewBox="0 0 40 40" fill="none" aria-hidden="true">
          <circle cx="20" cy="20" r="18" stroke="currentColor" stroke-width="1.1"/>
          <path d="M12 27 27 12M17 22C9 19 13 11 27 12c1 13-6 17-10 10Z" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/>
          <path d="m17 22 0-7m5 2h5" stroke="currentColor" stroke-width="1.1"/>
        </svg>
        <div><span class="brand-name">野游俱乐部</span><span class="brand-en">THE LITTLE WANDERERS</span></div>
      </div>
      <span class="edition">骑行手记 &nbsp; / &nbsp; NO. 006</span>
    </header>

    <div class="heading">
      <div><p class="eyebrow">A LITTLE RIDE, A LITTLE JOY</p><h1>顺风，慢骑。</h1></div>
      <p class="intro">沿着草木的方向，<br>把日子骑得慢一点。</p>
    </div>

              </g></g>

            <!-- The near raptorial foreleg has the mantis's characteristic spines. -->
            <path d="M730 189 775 218" fill="none" stroke="#345b3c" stroke-width="9"/>
            <path d="M730 189 775 218" fill="none" stroke="#9bb767" stroke-width="5.5"/>
            <path d="M771 211q33-15 69-13l4 10q-31 14-65 18Z" fill="#9ab663" stroke="#345b3c" stroke-width="2.4"/>
            <path d="m784 225 4 8 4-11m9 0 4 8 4-11m9 0 4 6 4-10" fill="#5c8146" stroke="#345b3c" stroke-width="1.4"/>
            <path d="M840 204 887 275l18 6" fill="none" stroke="#345b3c" stroke-width="6.5"/>
            <path d="M840 204 887 275" fill="none" stroke="#acc777" stroke-width="3.5"/>
            <circle cx="840" cy="204" r="5" fill="#ccda8b" stroke="#345b3c" stroke-width="2"/>

            <g fill="none" stroke="#b7bea2" stroke-width="3.8">

            </g>
            <g id="rearNearPedal" transform="translate(498 407)">

            <g id="frontNearPedal" transform="translate(744 407)">
              <rect x="-17" y="-4" width="34" height="9" rx="3" fill="#344c3e" stroke="#293f34" stroke-width="1.3"/>
              <path d="M-11-1h22" stroke="#c9b980" stroke-width="2"/>
            </g>
            <g fill="none">
              <path id="nearThighOutline" d="M672 264 781 326" stroke="#345b3c" stroke-width="14"/>
              <path id="nearThigh" d="M672 264 781 326" stroke="#93b05e" stroke-width="10"/>
              <path id="nearThighHighlight" d="M672 262 781 324" stroke="#c2d381" stroke-width="2.3"/>
              <path id="nearShinOutline" d="M781 326 744 402" stroke="#345b3c" stroke-width="7"/>
              <path id="nearShin" d="M781 326 744 402" stroke="#a4be71" stroke-width="4"/>
              <circle id="nearKnee" cx="781" cy="326" r="6.3" fill="#c0d17e" stroke="#345b3c" stroke-width="2.3"/>

            <circle cx="723" cy="434" r="4.5" fill="#dddcc7" stroke="#3b5243" stroke-width="1.5"/>

    <footer class="footer">
      <p class="caption">
        <svg viewBox="0 0 30 22" fill="none" stroke="currentColor" stroke-width="1.1" aria-hidden="true"><path d="M1 16q8-9 14 0t14-1M4 6h15m-5-4 5 4-5 4"/></svg>

      <div class="controls">
        <button id="playToggle" class="play-button" type="button" aria-label="暂停动画" data-paused="false">
          <span class="play-disc" aria-hidden="true">
            <svg class="pause-icon" viewBox="0 0 16 16" fill="currentColor"><rect x="4" y="3" width="2.5" height="10" rx=".7"/><rect x="9.5" y="3" width="2.5" height="10" rx=".7"/></svg>
            <svg class="play-icon" viewBox="0 0 16 16" fill="currentColor"><path d="m5 2 9 6-9 6Z"/></svg>
          </span>
          <span id="playLabel">歇一会儿</span>
        </button>
        <div class="tempo">
          <label for="speed">骑行节奏</label>
          <input id="speed" type="range" min="0.5" max="1.8" value="1" step="0.1" aria-valuetext="1 倍速度">
          <output id="speedLabel" for="speed">1.0×</output>

  </main>

  <script>
    (() => {
      'use strict';
      const byId = id => document.getElementById(id);
      const ids = [
        'bicycle', 'bikeShadow', 'rearSpokes', 'frontSpokes', 'rearChainring', 'frontChainring',
        'rearFarCrank', 'frontFarCrank', 'rearNearCrank', 'frontNearCrank',
        'rearNearCrankHighlight', 'frontNearCrankHighlight',
        'rearFarPedal', 'frontFarPedal', 'rearNearPedal', 'frontNearPedal',
        'farHindOutline', 'farHindLeg', 'farKnee', 'farFoot',
        'nearThighOutline', 'nearThigh', 'nearThighHighlight', 'nearShinOutline', 'nearShin', 'nearKnee', 'nearFoot',
        'timingChain', 'farLandscape', 'nearLandscape', 'clouds', 'foreground', 'roadMarks',
        'mantisHead', 'antennaFar', 'antennaNear', 'farEye', 'nearEye', 'scarfTail', 'scarfTailBack',
        'wind', 'butterfly', 'butterflyWings'
      ];
      const nodes = Object.fromEntries(ids.map(id => [id, byId(id)]));
      const playToggle = byId('playToggle');
      const speedInput = byId('speed');
      const motionPreference = window.matchMedia('(prefers-reduced-motion: reduce)');
      const crankRadius = 34;
      const gearRatio = 1.95;
      const wheelRadius = 98;
      const startPhase = -0.91;
      let phase = startPhase;
      let time = 0;
      let distance = 0;
      let speed = 1;
      let playing = !motionPreference.matches;
      let previousTime = null;
      let frameId = null;

      const set = (id, attribute, value) => nodes[id].setAttribute(attribute, value);
      const point = p => `${p.x.toFixed(2)} ${p.y.toFixed(2)}`;
      const segment = (a, b) => `M${point(a)} ${point(b)}`;
      const translate = (id, x, y = 0) => set(id, 'transform', `translate(${x.toFixed(2)} ${y.toFixed(2)})`);

      // Two-segment inverse kinematics keeps each foot planted on its pedal.
      function kneeFor(hip, foot, thighLength, shinLength) {
        const dx = foot.x - hip.x;
        const dy = foot.y - hip.y;
        const length = Math.max(0.001, Math.hypot(dx, dy));
        const along = (thighLength ** 2 - shinLength ** 2 + length ** 2) / (2 * length);
        const bend = Math.sqrt(Math.max(0, thighLength ** 2 - along ** 2));
        return {
          x: hip.x + dx * along / length + dy * bend / length,
          y: hip.y + dy * along / length - dx * bend / length
        };
      }

      function crankAt(x, angle, prefix) {
        const center = { x, y: 434 };
        const near = { x: x + Math.cos(angle) * crankRadius, y: 434 + Math.sin(angle) * crankRadius };
        const far = { x: x - Math.cos(angle) * crankRadius, y: 434 - Math.sin(angle) * crankRadius };
        set(`${prefix}NearCrank`, 'd', segment(center, near));
        set(`${prefix}NearCrankHighlight`, 'd', segment(center, near));
        set(`${prefix}FarCrank`, 'd', segment(center, far));
        translate(`${prefix}NearPedal`, near.x, near.y);
        translate(`${prefix}FarPedal`, far.x, far.y);
        set(`${prefix}Chainring`, 'transform', `rotate(${angle * 180 / Math.PI})`);
        return { near, far };
      }

      function render() {
        const turn = phase * 180 / Math.PI;
        const sway = Math.sin(phase * 2);
        translate('bicycle', 0, sway * 1.1);
        set('bikeShadow', 'rx', 366 + sway * 3);
        set('rearSpokes', 'transform', `rotate(${turn * gearRatio})`);
        set('frontSpokes', 'transform', `rotate(${turn * gearRatio})`);
        crankAt(477, phase, 'rear');
        const pedals = crankAt(723, phase, 'front');
        set('timingChain', 'stroke-dashoffset', -phase * 28);

        const nearHip = { x: 672, y: 264 };
        const farHip = { x: 662, y: 273 };
        const nearAnkle = { x: pedals.near.x - 3, y: pedals.near.y - 6 };
        const farAnkle = { x: pedals.far.x - 3, y: pedals.far.y - 6 };
        const nearKnee = kneeFor(nearHip, nearAnkle, 112, 112);
        const farKnee = kneeFor(farHip, farAnkle, 108, 111);
        const thigh = segment(nearHip, nearKnee);
        const shin = segment(nearKnee, nearAnkle);
        ['nearThighOutline', 'nearThigh', 'nearThighHighlight'].forEach(id => set(id, 'd', thigh));
        ['nearShinOutline', 'nearShin'].forEach(id => set(id, 'd', shin));
        const farLeg = `M${point(farHip)} ${point(farKnee)} ${point(farAnkle)}`;
        ['farHindOutline', 'farHindLeg'].forEach(id => set(id, 'd', farLeg));
        for (const [id, knee] of [['nearKnee', nearKnee], ['farKnee', farKnee]]) {
          set(id, 'cx', knee.x);
          set(id, 'cy', knee.y);
        }
        set('nearFoot', 'd', `M${nearAnkle.x - 6} ${nearAnkle.y}q10 5 24 2`);
        set('farFoot', 'd', `M${farAnkle.x - 5} ${farAnkle.y}q10 5 23 2`);

        // Road travel is coupled to wheel circumference; distant scenery moves more slowly.
        translate('farLandscape', -(distance * .038 % 1600));
        translate('nearLandscape', -(distance * .105 % 1600));
        translate('clouds', -(distance * .014 % 1600));
        translate('foreground', -(distance % 1400));
        translate('roadMarks', -(distance % 1400));
        set('wind', 'opacity', .4 + .22 * Math.sin(time * 1.8));

        const flutter = Math.sin(time * 7);
        const flutterBack = Math.sin(time * 7 - 1.7);
        set('scarfTail', 'd', `M725 170C695 ${183 + flutter * 3} 671 ${152 + flutter * 8} 634 ${160 + flutter * 7}L641 ${170 + flutter * 7}l-15 7c44-7 61 ${21 - flutter * 8} 94 ${6 - flutter * 7}Z`);
        set('scarfTailBack', 'd', `M723 171C693 173 673 ${148 + flutterBack * 7} 645 ${157 + flutterBack * 6}L631 ${166 + flutterBack * 6}l20 7c27-12 41 ${19 - flutterBack * 6} 69 ${12 - flutterBack * 6}Z`);
        set('mantisHead', 'transform', `rotate(${Math.sin(time * 1.7) * 1.3} 736 151)`);
        set('antennaFar', 'd', `M750 109Q${730 + Math.sin(time * 3) * 3} 74 ${750 + Math.sin(time * 3 - .7) * 6} ${40 + Math.sin(time * 2) * 2}`);
        set('antennaNear', 'd', `M775 108Q${786 + Math.sin(time * 2.8) * 4} 64 ${822 + Math.sin(time * 2.8 - 1) * 7} ${50 + Math.cos(time * 2) * 3}`);
        const blinkAt = time % 5.4;
        const eyeOpen = blinkAt > 4.95 && blinkAt < 5.16 ? Math.max(.08, Math.abs(blinkAt - 5.055) / .105) : 1;
        set('farEye', 'transform', `scale(1 ${eyeOpen})`);
        set('nearEye', 'transform', `scale(1 ${eyeOpen})`);
        translate('butterfly', 1065 + Math.sin(time * .82) * 30, 301 + Math.sin(time * 1.7) * 17);
        set('butterflyWings', 'transform', `rotate(-15) scale(${.45 + .5 * Math.abs(Math.sin(time * 10))} 1)`);
      }

      function updateControls() {
        playToggle.dataset.paused = String(!playing);
        playToggle.setAttribute('aria-label', playing ? '暂停动画' : '播放动画');
        byId('playLabel').textContent = playing ? '歇一会儿' : '继续兜风';
      }

      function tick(timestamp) {
        frameId = null;
        if (!playing || document.hidden) { previousTime = null; return; }
        if (previousTime !== null) {
          const delta = Math.min((timestamp - previousTime) / 1000, .05) * speed;
          const rotation = delta * 2.7;
          phase += rotation;
          time += delta;
          distance += rotation * gearRatio * wheelRadius;
          render();
        }
        previousTime = timestamp;
        frameId = requestAnimationFrame(tick);
      }

      function schedule() {
        if (playing && !document.hidden && frameId === null) {
          previousTime = null;
          frameId = requestAnimationFrame(tick);
        }
      }

      function setPlaying(value) {
        playing = value;
        if (frameId !== null) cancelAnimationFrame(frameId);
        frameId = null;
        previousTime = null;
        updateControls();
        schedule();
      }

      playToggle.addEventListener('click', () => setPlaying(!playing));
      speedInput.addEventListener('input', () => {
        speed = Number(speedInput.value);
        byId('speedLabel').textContent = `${speed.toFixed(1)}×`;
        speedInput.setAttribute('aria-valuetext', `${speed.toFixed(1)} 倍速度`);
      });
      document.addEventListener('keydown', event => {
        if (event.code !== 'Space' || event.repeat || event.altKey || event.ctrlKey || event.metaKey) return;
        if (event.target.closest('button, input, textarea, select, a, [contenteditable]')) return;
        event.preventDefault();
        setPlaying(!playing);
      });
      document.addEventListener('visibilitychange', () => {
        if (document.hidden) {
          if (frameId !== null) cancelAnimationFrame(frameId);
          frameId = null;
          previousTime = null;
        } else schedule();
      });
      motionPreference.addEventListener('change', event => setPlaying(!event.matches));
      render();
      updateControls();
      schedule();
    })();
  </script>
